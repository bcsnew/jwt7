<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List Item Pseudo Classes</title>
<style>
body {
font-family: Arial, sans-serif;
padding: 40px;
background: rgb(241, 245, 249);
}
h2 {
color: rgb(30, 41, 59);
}
ul {
list-style-type: none;
padding: 0;
max-width: 400px;
}
li {
padding: 12px 18px;
margin-bottom: 8px;
background: white;
border-radius: 6px;
border: 1px solid rgb(203, 213, 225);
color: rgb(51, 65, 85);
font-size: 16px;
}
li:first-child {
background: rgb(59, 130, 246);
color: white;
font-weight: bold;
border-color: rgb(37, 99, 235);
box-shadow: 0 4px 6px rgba(59, 130, 246, 0.25);
}
li:last-child {
background: rgb(16, 185, 129);
color: white;
font-weight: bold;
border-color: rgb(5, 150, 105);
box-shadow: 0 4px 6px rgba(16, 185, 129, 0.25);
}
</style>
</head>
<body>
<h2>Popular Programming Languages</h2>
<ul>
<li>Python</li>
<li>Java</li>
<li>C++</li>
<li>JavaScript</li>
<li>Go</li>
<li>Rust</li>
</ul>
</body>
</html>
